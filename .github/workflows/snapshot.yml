# SPDX-License-Identifier: GPL-2.0-or-later
name: Windows build

on:
  push:
    branches: [feat-agrv2k-support]
  pull_request:
    branches: [feat-agrv2k-support]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feat-agrv2k-support'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Use LF line endings for build scripts
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out source and pinned JimTcl
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            autoconf automake libtool make git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-libftdi
            mingw-w64-ucrt-x86_64-python

      - name: Build and install Windows executable
        run: |
          set -euo pipefail
          source_dir="$PWD"
          build_dir="$(cygpath -u "$RUNNER_TEMP")/openocd-build"
          prefix="$(cygpath -u "$RUNNER_TEMP")/openocd-windows-x64"
          mkdir -p "$build_dir" "$prefix" ci-results dist
          ./bootstrap nosubmodule
          cd "$build_dir"
          "$source_dir/configure" --host=x86_64-w64-mingw32 --prefix="$prefix" \
            --enable-agrv2k --enable-ch347 --enable-ftdi \
            --enable-cmsis-dap --enable-cmsis-dap-v2 --enable-internal-jimtcl \
            --disable-jlink --without-capstone --disable-werror \
            --disable-doxygen-html --disable-doxygen-pdf MAKEINFO=true
          make -j4
          make check
          make install
          strip "$prefix/bin/openocd.exe"
          "$prefix/bin/openocd.exe" --version
          cp config.log "$source_dir/ci-results/"
          pacman -Q > "$source_dir/ci-results/msys2-packages.txt"
          gcc --version > "$source_dir/ci-results/compiler.txt"

      - name: Check AGM configuration and RISC-V isolation
        run: |
          set -euo pipefail
          openocd="$(cygpath -u "$RUNNER_TEMP")/openocd-windows-x64/bin/openocd.exe"
          python testing/agm/check-configs.py --openocd "$openocd" > ci-results/configs.json
          python testing/agm/check-isolation.py --openocd "$openocd" > ci-results/isolation.json
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -Isrc \
            testing/agm/test-agrv2k-dm.c src/target/agm/agrv2k_dm.c \
            -o ci-results/test-agrv2k-dm.exe
          ./ci-results/test-agrv2k-dm.exe | tee ci-results/dm-contracts.txt
          python testing/agm/test-flash-loader.py 2>&1 | tee ci-results/flash-loader.txt
          mkdir -p ci-results/flash-temp
          "$(cygpath -u "$RUNNER_TEMP")/openocd-build/jimtcl/jimsh.exe" \
            testing/agm/flash-contracts.tcl tcl/target/agm/agrv2k-flash.tcl \
            ci-results/flash-temp | tee ci-results/flash-contracts.txt

      - name: Verify AGM stays disabled by default
        run: |
          set -euo pipefail
          source_dir="$PWD"
          disabled_dir="$(cygpath -u "$RUNNER_TEMP")/openocd-default"
          mkdir -p "$disabled_dir"
          cd "$disabled_dir"
          "$source_dir/configure" --host=x86_64-w64-mingw32 \
            --enable-ch347 --enable-cmsis-dap --enable-cmsis-dap-v2 \
            --enable-internal-jimtcl --disable-jlink --without-capstone \
            --disable-werror --disable-doxygen-html --disable-doxygen-pdf MAKEINFO=true
          make -j4
          make check
          cp config.log "$source_dir/ci-results/default-config.log"
          cd "$source_dir"
          python testing/agm/check-isolation.py \
            --openocd "$(cygpath -u "$RUNNER_TEMP")/openocd-windows-x64/bin/openocd.exe" \
            --disabled-openocd "$disabled_dir/src/openocd.exe" > ci-results/isolation.json

      - name: Bundle executable, runtime DLLs and scripts
        run: |
          set -euo pipefail
          python contrib/package-windows.py \
            --prefix "$(cygpath -m "$RUNNER_TEMP")/openocd-windows-x64" \
            --runtime "$(cygpath -m "$MINGW_PREFIX")" \
            --output dist/openocd-windows-x64.zip
          sha256sum dist/openocd-windows-x64.zip | tee ci-results/package.sha256

      - name: Test extracted package without MSYS2 on PATH
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'openocd-portable-test'
          Expand-Archive -LiteralPath dist/openocd-windows-x64.zip -DestinationPath $destination
          $exe = Join-Path $destination 'openocd-windows-x64/bin/openocd.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:OPENOCD_SCRIPTS -ErrorAction SilentlyContinue
          Set-Location $env:RUNNER_TEMP
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable executable failed to start' }
          & $exe -f board/agm/agm32_vf407-cmsis-dap.cfg -c shutdown
          if ($LASTEXITCODE -ne 0) { throw 'Installed AGM scripts could not be loaded' }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/openocd-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-build-logs
          path: |
            ci-results/
            ${{ runner.temp }}/openocd-build/config.log
            ${{ runner.temp }}/openocd-build/testing/**/*.log
          if-no-files-found: warn
          retention-days: 14
