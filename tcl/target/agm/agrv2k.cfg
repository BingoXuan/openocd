# AGM AGRV2K: RISC-V Debug Module on AP0 of an ARM ADIv5 DAP.
# Transport is selected by the adapter/board configuration.
# Uses the isolated agrv2k target; the generic riscv target is unmodified.

source [find target/swj-dp.tcl]

if {![info exists CHIPNAME]} { set CHIPNAME agrv2k }
set _TARGETNAME $CHIPNAME.cpu
swj_newdap $CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $CHIPNAME.dap -tap $CHIPNAME.cpu
target create $_TARGETNAME agrv2k -endian little -dap $CHIPNAME.dap -ap-num 0
# Keep loader/FIFO scratch away from low SRAM used by VF407 DMA descriptors.
# Backups protect halted CPU data, but cannot prevent a live DMA engine from
# overwriting a loader. Applications must keep this region free of active DMA.
if {![info exists AGRV2K_WORK_AREA]} { set AGRV2K_WORK_AREA 0x20018000 }
if {![info exists AGRV2K_WORK_AREA_SIZE]} { set AGRV2K_WORK_AREA_SIZE 0x8000 }
$_TARGETNAME configure -work-area-phys $AGRV2K_WORK_AREA -work-area-size $AGRV2K_WORK_AREA_SIZE -work-area-backup 1

set AGRV2K_TARGET $_TARGETNAME
set AGRV2K_DEVICE_ID_ADDRESS 0x03000100

proc agrv2k_info {} {
	global AGRV2K_TARGET AGRV2K_DEVICE_ID_ADDRESS
	targets $AGRV2K_TARGET
	set id [lindex [read_memory $AGRV2K_DEVICE_ID_ADDRESS 32 1] 0]
	echo [format "AGRV2K DEVICE_ID=0x%08x" $id]
	return $id
}
