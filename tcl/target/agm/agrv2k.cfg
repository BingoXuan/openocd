# AGM AGRV2K: RISC-V Debug Module on AP0 of an ARM ADIv5 DAP.
# Transport is selected by the adapter/board configuration.
# Based on OpenOCD Gerrit 9590 and AGaMEMnon's open AGRV2K configuration.

source [find target/swj-dp.tcl]

if {![info exists CHIPNAME]} { set CHIPNAME agrv2k }
set _TARGETNAME $CHIPNAME.cpu
swj_newdap $CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $CHIPNAME.dap -tap $CHIPNAME.cpu
target create $_TARGETNAME riscv -endian little -dap $CHIPNAME.dap -ap-num 0
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x10000 -work-area-backup 1
riscv mem_access sysbus progbuf

set AGRV2K_TARGET $_TARGETNAME
set AGRV2K_DEVICE_ID_ADDRESS 0x03000100

proc agrv2k_info {} {
	global AGRV2K_TARGET AGRV2K_DEVICE_ID_ADDRESS
	targets $AGRV2K_TARGET
	set id [lindex [read_memory $AGRV2K_DEVICE_ID_ADDRESS 32 1] 0]
	echo [format "AGRV2K DEVICE_ID=0x%08x" $id]
	return $id
}
