# TAP/PLD-only profile: scan/configure PL without attaching either ARM core.
source [find interface/ch347.cfg]
transport select jtag
adapter speed 500
reset_config none

jtag newtap zynq_pl bs -irlen 6 -ircapture 0x1 -irmask 0x03 \
	-ignore-version -expected-id 0x03722093
jtag newtap zynq dap -irlen 4 -ircapture 0x1 -irmask 0xf \
	-expected-id 0x4ba00477
pld create zynq_pl.pld virtex2 -tap zynq_pl.bs -no_jstart
