# CH347 SWD requires SWD-capable firmware and SWD wiring, not JTAG wiring.
# CH347 + VF407 SWD is not yet qualified on physical hardware in this fork.
source [find interface/ch347.cfg]
transport select swd
adapter speed 1000
reset_config none
source [find board/agm/agm32_vf407.cfg]
