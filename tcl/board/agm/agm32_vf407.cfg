# VF407 / AGRV2KL100 target configuration. Source an SWD adapter first.

source [find target/agm/agrv2k.cfg]

set AGRV2K_FLASH_BASE 0x80000000
set AGRV2K_FLASH_SIZE 0x100000
set AGRV2K_FLASH_SECTOR_SIZE 0x1000
set AGRV2K_FLASH_CONTROLLER 0x40001000
# Current Leego VF407 layout reserves [0xe7000, 0x100000) for CPLD startup.
# Verify the actual board layout before explicitly enabling a flash operation.
if {![info exists AGRV2K_FLASH_WRITABLE_SIZE]} {
	set AGRV2K_FLASH_WRITABLE_SIZE 0xe7000
}
flash bank $CHIPNAME.flash agrv2k $AGRV2K_FLASH_BASE $AGRV2K_FLASH_WRITABLE_SIZE 4 4 $AGRV2K_TARGET
source [find target/agm/agrv2k-flash.tcl]
